; llama-server router presets. Section name = the "model" field clients send.
; Keys are llama-server CLI flags without the leading dashes.
; Only one model is resident at a time (--models-max 1 in run.sh): two 27Bs
; do not fit together in the 37.4 GiB Metal budget.

[*]
; shared by every model -- the settings benchmarked in ../llm-bench and ./README.md
n-gpu-layers = 999
parallel     = 1
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn   = on
jinja        = true

[qwen3.8-27b]
; Qwen3.8-27B UD-Q4_K_XL (Unsloth quant), hybrid qwen35, vision via mmproj
model    = models/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj   = models/Qwen3.8-27B-mmproj-F16.gguf
ctx-size = 262144

[bonsai2-27b]
; Ternary Bonsai 2 27B, PQ2_0 -- the faster packing on Metal (~1.7x Qwen decode)
model    = models/Ternary-Bonsai-2-27B-PQ2_0.gguf
ctx-size = 262144

[bielik-11b-v3]
; Bielik-11B-v3.0-Instruct Q8_0 (SpeakLeash), Polish; llama arch, native 32K context
model    = models/Bielik-11B-v3.0-Instruct.Q8_0.gguf
ctx-size = 32768
